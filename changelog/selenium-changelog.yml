  - version: 4.47.0
    date: '2026-08-10'
    announcement: https://www.selenium.dev/blog/2026/selenium-4-47-released/
    breaking:
      - Removed deprecated FTP proxy support (#17846).
    deprecations:
      - Deprecated invalid Firefox profile code (#17871).
    additions:
      - 'Support for CDP versions v149, v150, v151.'
      - Added objectOnly / preserveExtras / scalar-primitive signals to the shared BiDi schema (#17784).
