      - Grid honors a client-advertised se:remoteUrl for reachable BiDi/CDP/VNC URLs (#17790).
    fixes:
      - Corrected float/enum type fidelity in the shared BiDi schema and validated primitives outbound in Ruby (#17852).
      - Marked BiDi types extensible per spec (#17853); validate BiDi outbound ref fields against their declared type (#17861).
      - Fixed GeckoDriver rejecting system-access via capabilities (#17811).
      - Selenium Manager SBOM and NOTICE are now downloaded and bundled in each package (#17820).
