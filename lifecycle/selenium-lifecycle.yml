  note: >-
    A `nightly` pre-release tag is also published continuously (last seen 2026-08-26). Every stable
    release gets a dated announcement post at https://www.selenium.dev/blog/.
status_page:
  present: false
  url: null
  note: >-
    No status page exists and none could. WebDriver, Grid and Selenium Manager all run on
    infrastructure the consumer owns; there is no Selenium-operated endpoint whose uptime could be
    reported. The nearest operational dependencies an agent should watch are the browser-vendor
    driver feeds Selenium Manager downloads from (Chrome for Testing, Mozilla, Microsoft), which the
    Selenium Manager docs call out as the known connectivity failure mode.
sla:
  published: false
  note: >-
    No SLA. Selenium is a volunteer open-source project under the Software Freedom Conservancy;
    support is community support (https://www.selenium.dev/support/), not a contracted service.
support:
