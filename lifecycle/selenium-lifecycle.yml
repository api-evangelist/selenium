provider: Selenium
providerId: selenium
description: >-
  Versioning, deprecation and support posture for the Selenium project. Selenium ships software
  people run themselves; there is no vendor-operated service, so several fields that would carry an
  SLA or an uptime page for a SaaS provider are structurally not applicable here and are recorded
  as such rather than left blank.
versioning:
  scheme: MAJOR.MINOR.PATCH release train (explicitly NOT semver)
  current_version: 4.47.0
  released: '2026-08-10'
  in_url: false
  in_header: false
  note: >-
    AGENTS.md: "This project does not follow semantic versioning (semver)". The number is a
    coordinated release train — Java, Python, .NET, Ruby and JavaScript all published 4.47.0 within
    eight minutes of one another on 2026-08-10. The wire protocol itself is versioned by the W3C
    (WebDriver Level 2 / WebDriver BiDi), not by Selenium's release number, so a Selenium upgrade
    does not change the HTTP contract.
  compatibility_invariant: >-
    "Maintain API/ABI compatibility by default (users upgrade by changing only the version number);
    public functionality may be removed only after it has gone through the Deprecation policy."
deprecation:
  policy_published: true
  policy_url: https://github.com/SeleniumHQ/selenium/blob/trunk/AGENTS.md
  policy: >-
    Before removing public functionality, it must first be marked deprecated with a message pointing
    to the alternative. Language-specific AGENTS.md files carry the per-binding deprecation
    mechanism.
  sunset_header: false
  deprecation_header: false
  note: >-
    RFC 8594 Sunset/Deprecation headers are not used and would not apply — deprecation here is a
    source-level annotation in five language bindings, surfaced to the developer at compile time or
    as a runtime warning, not an HTTP response header. That is the correct mechanism for a client
    library, but it means an agent calling the wire protocol gets no deprecation signal at all.
  recent_deprecations:
    - item: FTP proxy support
      action: removed
      version: 4.47.0
      source: javascript/selenium-webdriver/CHANGES.md — "remove deprecated FTP proxy support (#17846)"
    - item: Invalid Firefox profile code
      action: deprecated
      version: 4.47.0
      source: javascript/selenium-webdriver/CHANGES.md — "deprecate invalid Firefox profile code (#17871)"
    - item: Chrome DevTools Protocol (CDP) integration
      action: legacy
      status: superseded by WebDriver BiDi
      source: >-
        llms.txt — "WebDriver BiDi is the supported route for events, network interception, and
        console log access. The Chrome DevTools Protocol integration is legacy."
        See also https://www.selenium.dev/documentation/warnings/bidi-implementation/
    - item: Desired Capabilities
      action: removed
      version: '4.0'
      replacement: Per-browser Options classes
      source: https://www.selenium.dev/documentation/webdriver/troubleshooting/upgrade_to_selenium_4/
    - item: JSON Wire Protocol (OSS dialect)
      action: removed
      version: '4.0'
      replacement: W3C WebDriver protocol
      source: https://www.selenium.dev/documentation/legacy/json_wire_protocol/
    - item: Third-party driver managers and manual driver paths
      action: discouraged
      replacement: Selenium Manager, bundled since 4.6
      source: >-
        llms.txt — "Selenium 4.6 and later include Selenium Manager... Do not set driver executable
        paths and do not use third-party driver managers."
