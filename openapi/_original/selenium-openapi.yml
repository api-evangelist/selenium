openapi: 3.1.0
info:
  title: Selenium WebDriver (W3C Wire Protocol)
  description: >-
    Selenium WebDriver implements the W3C WebDriver protocol — a
    platform- and language-neutral HTTP wire protocol used by
    out-of-process programs to remotely instruct browsers. This
    OpenAPI definition lists common endpoints exposed by a WebDriver
    remote end (e.g. a Selenium Grid node, selenium-standalone, or a
    browser-specific driver such as chromedriver/geckodriver).
    No authentication is defined by the W3C protocol itself; deployments
    typically front the endpoint with a reverse proxy or run on
    a private network.
  version: "1.0"
  contact:
    name: Selenium
    url: https://www.selenium.dev/documentation/webdriver/
servers:
  - url: http://localhost:4444/wd/hub
    description: Default Selenium standalone / Grid endpoint
  - url: http://localhost:9515
    description: ChromeDriver default port
  - url: http://localhost:4444
    description: Geckodriver / generic WebDriver default
tags:
  - name: Status
    description: Remote end readiness
  - name: Session
    description: Session lifecycle
  - name: Navigation
    description: Page navigation and metadata
  - name: Elements
    description: Element discovery and interaction
  - name: Script
    description: Execute JavaScript in the page context
  - name: Cookies
    description: Cookie management
paths:
  /status:
    get:
      tags: [Status]
      summary: Check remote end readiness
      operationId: getStatus
      responses:
        '200':
          description: Readiness payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: object
                    properties:
                      ready: { type: boolean }
                      message: { type: string }
  /session:
    post:
      tags: [Session]
      summary: Create a new WebDriver session
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                capabilities:
                  type: object
                  description: W3C capabilities request (alwaysMatch, firstMatch)
      responses:
        '200': { description: Session created }
  /session/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      tags: [Session]
      summary: Terminate a session
      operationId: deleteSession
      responses:
        '200': { description: Session deleted }
  /session/{sessionId}/url:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Navigation]
      summary: Navigate to a URL
      operationId: navigateTo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        '200': { description: OK }
    get:
      tags: [Navigation]
      summary: Get the current page URL
      operationId: getCurrentUrl
      responses:
        '200':
          description: Current URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  value: { type: string, format: uri }
  /session/{sessionId}/title:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Navigation]
      summary: Get page title
      operationId: getTitle
      responses:
        '200': { description: Title }
  /session/{sessionId}/back:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Navigation]
      summary: Navigate back
      operationId: navigateBack
      responses: { '200': { description: OK } }
  /session/{sessionId}/forward:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Navigation]
      summary: Navigate forward
      operationId: navigateForward
      responses: { '200': { description: OK } }
  /session/{sessionId}/element:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Elements]
      summary: Find a single element
      operationId: findElement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Locator' }
      responses: { '200': { description: Element reference } }
  /session/{sessionId}/elements:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Elements]
      summary: Find multiple elements
      operationId: findElements
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Locator' }
      responses: { '200': { description: Array of element references } }
  /session/{sessionId}/element/{elementId}/click:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/ElementId'
    post:
      tags: [Elements]
      summary: Click an element
      operationId: clickElement
      responses: { '200': { description: OK } }
  /session/{sessionId}/execute/sync:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Script]
      summary: Execute JavaScript synchronously
      operationId: executeScriptSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [script, args]
              properties:
                script: { type: string }
                args:
                  type: array
                  items: {}
      responses: { '200': { description: Script return value } }
  /session/{sessionId}/cookie:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Cookies]
      summary: Retrieve all cookies
      operationId: getCookies
      responses: { '200': { description: Cookie array } }
components:
  parameters:
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: { type: string }
      description: WebDriver session ID
    ElementId:
      in: path
      name: elementId
      required: true
      schema: { type: string }
      description: WebDriver element reference ID
  schemas:
    Locator:
      type: object
      required: [using, value]
      properties:
        using:
          type: string
          enum: [css selector, link text, partial link text, tag name, xpath]
        value: { type: string }
