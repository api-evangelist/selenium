openapi: 3.2.0
info:
  title: Selenium WebDriver (W3C Wire Protocol) Script API
  description: Selenium WebDriver implements the W3C WebDriver protocol — a platform- and language-neutral HTTP wire protocol used by out-of-process programs to remotely instruct browsers.
  version: '1.0'
  contact:
    name: Selenium
    url: https://www.selenium.dev/documentation/webdriver/
servers:
- url: http://localhost:4444/wd/hub
  description: Default Selenium standalone / Grid endpoint
- url: http://localhost:9515
  description: ChromeDriver default port
- url: http://localhost:4444
  description: Geckodriver / generic WebDriver default
tags:
- name: Script
  description: Execute JavaScript in the page context
paths:
  /session/{sessionId}/execute/sync:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      tags:
      - Script
      summary: Execute JavaScript synchronously
      operationId: executeScriptSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - script
              - args
              properties:
                script:
                  type: string
                args:
                  type: array
                  items: {}
      responses:
        '200':
          description: Script return value
components:
  parameters:
    SessionId:
      in: path
      name: sessionId
      required: true
      schema:
        type: string
      description: WebDriver session ID
