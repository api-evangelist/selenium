free: true
license: Apache-2.0
funding_model: >-
  Sponsorship and donation, not sales. https://www.selenium.dev/sponsors/ (200, 2026-08-26) lists
  project sponsors and https://www.selenium.dev/sponsor/ solicits new ones. Money flows to the
  project, never from a user to use the software.
note: >-
  This file previously carried a fabricated three-tier scaffold ("selenium-free" with a monthly API
  request quota) written by the 2026-05-04 bulk sweep — see roadmap#35. Selenium has no API request
  quota because Selenium does not serve API requests: the software runs on the consumer's own
  machine. The scaffold has been replaced with the measured zero. plan_count: 0 here is a finding,
  not a gap.
adjacent_commercial_note: >-
  Paid Selenium-compatible services do exist — BrowserStack, Sauce Labs, TestMu AI (formerly
  LambdaTest), Applitools and others run hosted grids that speak the same W3C WebDriver protocol.
  Their pricing belongs to those providers, not to Selenium, and is deliberately not recorded here.
