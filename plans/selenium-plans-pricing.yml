source: >-
  https://www.selenium.dev/ , https://www.selenium.dev/downloads/ , https://www.selenium.dev/sponsors/
  and https://www.selenium.dev/project/ — searched 2026-08-26. No pricing or plans page exists on
  the site; the sitemap (https://www.selenium.dev/en/sitemap.xml, 702 URLs) contains no /pricing/
  path.
description: >-
  Selenium publishes no plans and charges no money. It is a volunteer open-source project under the
  Software Freedom Conservancy, distributed under Apache-2.0, with every component — the language
  bindings, Selenium Grid, Selenium Manager, Selenium IDE and the Docker images — available at no
  cost from public package registries and GitHub releases. There is no account, no key, no metered
  quota and no commercial tier, because there is no vendor-operated service to meter.
plan_count: 0
