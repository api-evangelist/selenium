provider: Selenium
providerId: selenium
name: Selenium WebDriver (candidate MCP surface)
status: candidate
description: >-
  The Selenium project ships NO official MCP server. A search of the SeleniumHQ GitHub
  organization (23 repos, listed 2026-08-26), www.selenium.dev/llms.txt, the documentation site
  and the npm/PyPI registries found no first-party server. Every "Selenium MCP" package on the
  registries — selenium-mcp-server (PyPI), angiejones/mcp-selenium, SirBlobby/mcp-selenium,
  naveenanimation20/selenium-mcp, @dhivakaranthonydoss/mcp-selenium and others — is
  community-maintained and unaffiliated with the Selenium project. This file therefore records a
  DERIVED candidate tool list, computed from the WebDriver operations already captured in
  openapi/, so the surface is documented without asserting a server that does not exist.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: derived
notes:
  - >-
    Even if the Selenium project shipped a server, the deployment mode could only ever be
    local-stdio. WebDriver drives a browser process on the caller's own machine; there is no
    vendor-operated endpoint an agent could POST to, and any remote form is a Selenium Grid the
    consumer runs themselves at http://localhost:4444.
  - >-
    Never treat a community package as this provider's MCP server. None of the packages above is
    published by SeleniumHQ and none is referenced from selenium.dev.
  - >-
    The provider DOES publish agent-facing material: an AGENTS.md at the monorepo root (saved to
    skills/selenium-AGENTS.md) and a curated llms.txt with explicit code-generation guidance.
    Those are the real agent surfaces here, not an MCP server.
