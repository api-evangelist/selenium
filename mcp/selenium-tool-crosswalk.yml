source: >-
  openapi/selenium-*-openapi.yml, graphql/selenium-grid.graphql, and
  mcp/selenium-mcp.yml (candidate tools). GraphQL SDL harvested verbatim from
  https://raw.githubusercontent.com/SeleniumHQ/selenium/trunk/java/src/org/openqa/selenium/grid/graphql/selenium-grid-schema.graphqls
provider: Selenium
providerId: selenium
description: >-
  Crosswalk between Selenium's two machine-readable surfaces. The W3C WebDriver HTTP surface
  (captured in openapi/) drives a browser; the Selenium Grid GraphQL surface (captured verbatim in
  graphql/) inspects the Grid's own fleet state. They are NOT projections of one core — they answer
  different questions against different components, which is exactly the divergence this artifact
  exists to record. There is no MCP server, so the tool column is the derived candidate list from
  mcp/selenium-mcp.yml and every binding is confidence low-to-medium by construction.
surfaces:
  openapi:
    files:
      - openapi/selenium-status-api-openapi.yml
      - openapi/selenium-session-api-openapi.yml
      - openapi/selenium-navigation-api-openapi.yml
      - openapi/selenium-elements-api-openapi.yml
      - openapi/selenium-script-api-openapi.yml
      - openapi/selenium-cookies-api-openapi.yml
    base: http://localhost:4444
    gated: false
    note: >-
      Self-hosted. The base is the consumer's own Grid/driver process, not a Selenium-operated
      host, so it can be probed only against an instance the caller runs.
  graphql:
    endpoint: http://localhost:4444/graphql
    schema: graphql/selenium-grid.graphql
    gated: false
    docs: https://www.selenium.dev/documentation/grid/advanced_features/graphql_support/
    note: >-
      Selenium Grid exposes a read-only GraphQL query surface (schema { query: GridQuery }) for
      fleet introspection. Served by the same self-hosted Grid, so it is reachable only on an
      instance the caller runs. SDL harvested from the source repo, not from live introspection.
  mcp:
    url: null
    gated: null
    note: No official MCP server exists — see mcp/selenium-mcp.yml.
crosswalk:
