    category: grid
    rest: [getStatus]
    graphql: [GridQuery.grid.nodeCount, GridQuery.grid.sessionCount]
    binding: one-to-one
    confidence: high
    note: >-
      GET /status is the documented Grid readiness endpoint
      (https://www.selenium.dev/documentation/grid/advanced_features/endpoints/). The GraphQL grid
      fields answer the same "is there capacity" question with much more detail.
