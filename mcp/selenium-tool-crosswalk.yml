mcp_only: []
graphql_only:
  - field: GridQuery.grid
    reason: >-
      Grid-level fleet state (uri, totalSlots, nodeCount, maxSession, sessionCount, version,
      sessionQueueSize). No W3C WebDriver HTTP operation reports it; /status returns readiness only.
  - field: GridQuery.nodesInfo.nodes
    reason: >-
      Per-Node inventory — id, uri, status (UP/DRAINING/DOWN), maxSession, slotCount, stereotypes,
      version, osInfo{arch,name,version}. Grid-management data with no WebDriver equivalent.
  - field: GridQuery.sessionsInfo
    reason: >-
      Live session census across the fleet plus sessionQueueRequests. WebDriver can only address
      the one session it holds an id for.
  - field: GridQuery.session
    reason: >-
      Look up any session by id and read capabilities, startTime, uri, nodeId, nodeUri,
      sessionDurationMillis and its slot. Cross-session visibility WebDriver does not have.
rest_only:
  - operationId: getStatus
    reason: >-
      Also reachable as a plain readiness probe on a bare driver process (chromedriver,
      geckodriver) that runs no GraphQL surface at all.
  - note: >-
      Every browser-driving operation (navigate, find, click, execute script, cookies) is REST-only.
      The Grid GraphQL schema is read-only fleet introspection — it exposes no mutation type and
      cannot drive a browser.
