description: >-
  First-party Selenium client bindings and distribution artifacts. Selenium publishes official
  language bindings for Java, Python, .NET, Ruby and JavaScript from the SeleniumHQ/selenium
  monorepo, plus first-party Docker images for Selenium Grid and an npm CLI runner for
  Selenium IDE. All of the core bindings ship in lockstep on the same version number
  (4.47.0 on 2026-08-10), which is the project's stated release convention.
notes:
  - >-
    Version lockstep is real and verifiable: selenium-webdriver (npm), selenium (PyPI),
    selenium-webdriver (RubyGems), Selenium.WebDriver + Selenium.Support (NuGet) and
    org.seleniumhq.selenium:selenium-java (Maven Central) all read 4.47.0, all published
    2026-08-10 within eight minutes of one another.
  - >-
    search.maven.org's solrsearch index reported a stale latestVersion of 4.33.0; the
    authoritative repo1.maven.org maven-metadata.xml reads 4.47.0 (lastUpdated 20260810180956).
    Version below is taken from maven-metadata.xml.
  - >-
    selenium-side-runner is the Selenium IDE CLI, published from SeleniumHQ/selenium-ide,
    a separate repo on a separate cadence. Its last release predates the current WebDriver
    bindings by more than 20 months.
  - >-
    Selenium Manager is a first-party Rust CLI but is NOT published to crates.io
    (crates.io/api/v1/crates/selenium-manager returns "crate does not exist"). It is shipped
    inside every binding release and snapshotted at SeleniumHQ/selenium_manager_artifacts.
