x-base-url-note: >-
  apis.yml previously carried baseURL https://www.selenium.dev on every API entry. That is the
  documentation host, not an API host: https://www.selenium.dev/status and
  https://www.selenium.dev/graphql both returned 404 with the site's Hugo 404 HTML on 2026-08-26,
  and repair-api-bases.py returns the verdict `no-usable-base` for this provider. Selenium is
  self-hosted software — the WebDriver remote end and Selenium Grid run on infrastructure the
  consumer owns — and the project documents the default base as http://localhost:4444 ("Default URL
  for all the above modes is http://localhost:4444",
  https://www.selenium.dev/documentation/grid/advanced_features/endpoints/). Every baseURL has been
  set to that documented default, which also matches the servers[] blocks already present in
  openapi/. A localhost base here is the correct measurement, not a placeholder.

