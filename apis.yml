name: Selenium
description: >-
  Selenium is the open-source browser automation project behind the W3C WebDriver and WebDriver BiDi
  standards. It drives real browsers through a vendor-neutral, standardised HTTP wire protocol that
  the browser vendors implement themselves, with official language bindings for Java, Python, C#,
  Ruby and JavaScript, all released in lockstep. The suite covers WebDriver (the browser-control
  protocol), Selenium Grid (distributed, parallel execution across machines and platforms),
  Selenium Manager (a Rust CLI that resolves and downloads matching browser drivers automatically)
  and Selenium IDE (record and playback). Selenium is self-hosted software rather than a service:
  there is no vendor-operated API host, no account and no pricing — the remote end runs on
  infrastructure the consumer owns, at a documented default of http://localhost:4444, under
  Apache-2.0 and the stewardship of the Software Freedom Conservancy.
